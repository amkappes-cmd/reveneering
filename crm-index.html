<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reveneering CRM</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --black:#0A0A0A;
  --gray-700:#374151;--gray-500:#6B7280;--gray-400:#9CA3AF;--gray-300:#D1D5DB;
  --gray-200:#E5E7EB;--gray-100:#F3F4F6;--gray-50:#F9FAFB;
  --green:#16A34A;--green-light:#DCFCE7;--green-border:#86EFAC;--green-text:#166534;--green-soft:#F0FDF4;
  --warm-bg:#FFFBF5;--warm-border:#E8C98A;--warm-text:#5C4A1E;--warm-strong:#3A2D0E;
  --border:1px solid #E5E7EB;
  --radius:8px;--radius-lg:12px;
  /* legacy alias kept so inline var() calls inside the render templates still resolve */
  --muted2:#9CA3AF;
}
html{scroll-behavior:smooth}
body{background:#FFFFFF;color:var(--black);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;line-height:1.5;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}

/* PASSWORD GATE */
#pw-gate{position:fixed;inset:0;z-index:9999;background:#FFFFFF;display:flex;align-items:center;justify-content:center;padding:24px}
.pw-card{background:#FFFFFF;border:var(--border);border-radius:var(--radius-lg);padding:36px 32px;width:100%;max-width:400px}
.pw-logo{display:flex;align-items:center;gap:8px;margin-bottom:30px}
.pw-wm{font-size:17px;font-weight:600;letter-spacing:-0.03em;color:var(--black)}
.pw-eyebrow{font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--green);margin-bottom:10px}
.pw-title{font-size:30px;font-weight:700;letter-spacing:-0.03em;line-height:1.15;color:var(--black);margin-bottom:8px}
.pw-desc{font-size:14px;color:var(--gray-500);line-height:1.6;margin-bottom:22px}
.pw-iw{position:relative;margin-bottom:10px}
.pw-inp{width:100%;background:#FFFFFF;border:var(--border);border-radius:7px;color:var(--black);font-family:inherit;font-size:14px;font-weight:400;padding:12px 62px 12px 14px;outline:none;transition:border-color 0.15s}
.pw-inp::placeholder{color:var(--gray-400)}
.pw-inp:focus{border-color:var(--black)}
.pw-inp.shk{animation:shk 0.35s ease;border-color:var(--warm-border);background:var(--warm-bg)}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.pw-tog{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--gray-400);font-size:11px;font-weight:600;font-family:inherit;letter-spacing:0.06em;text-transform:uppercase;padding:3px;transition:color 0.15s}
.pw-tog:hover{color:var(--black)}
.pw-err{font-size:12px;color:var(--warm-text);min-height:18px;margin-bottom:12px}
.pw-btn{width:100%;background:var(--black);color:#FFFFFF;font-family:inherit;font-size:14px;font-weight:500;padding:13px;border-radius:7px;border:none;cursor:pointer;transition:background 0.15s}
.pw-btn:hover{background:#222222}
#pw-gate.fade{animation:gfade 0.4s ease forwards}
@keyframes gfade{to{opacity:0;pointer-events:none}}

/* TOP NAV */
.topbar{position:sticky;top:0;z-index:100;background:#FFFFFF;border-bottom:var(--border);height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.topbar-logo{display:flex;align-items:center;gap:8px;text-decoration:none}
.topbar-wordmark{font-size:17px;font-weight:600;letter-spacing:-0.03em;color:var(--black)}
.topbar-tag{font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--gray-400);border-left:var(--border);padding-left:12px;margin-left:4px}
.topbar-right{display:flex;align-items:center;gap:10px}
.btn-add{display:inline-flex;align-items:center;gap:6px;background:var(--black);color:#FFFFFF;font-family:inherit;font-size:13px;font-weight:500;padding:9px 18px;border-radius:6px;border:none;cursor:pointer;transition:background 0.15s}
.btn-add:hover{background:#222222}
.btn-import{display:inline-flex;align-items:center;gap:6px;background:#FFFFFF;color:var(--gray-700);font-family:inherit;font-size:13px;font-weight:500;padding:8px 14px;border-radius:6px;border:var(--border);cursor:pointer;transition:border-color 0.15s,color 0.15s}
.btn-import:hover{border-color:var(--black);color:var(--black)}
.btn-import:disabled{opacity:0.5;pointer-events:none}
.import-bar{background:var(--gray-50);border:var(--border);border-left:3px solid var(--green);border-radius:0 var(--radius) var(--radius) 0;padding:16px 20px;margin-bottom:14px;display:none;align-items:center;gap:14px}
.import-bar.show{display:flex}
.import-bar-text{font-size:13px;color:#4B5563;line-height:1.6;flex:1}
.import-bar-text strong{color:var(--black);font-weight:600}
.import-bar-close{background:none;border:none;color:var(--gray-400);cursor:pointer;font-size:15px;padding:0 4px;line-height:1}
.import-bar-close:hover{color:var(--black)}

/* LAYOUT */
.layout{position:relative;z-index:1;padding:28px 24px 48px;max-width:1400px;margin:0 auto}

/* FILTERS */
.filters{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.filter-input{background:#FFFFFF;border:var(--border);border-radius:6px;color:var(--black);font-family:inherit;font-size:13px;padding:9px 12px;outline:none;transition:border-color 0.15s;min-width:240px}
.filter-input:focus{border-color:var(--black)}
.filter-input::placeholder{color:var(--gray-400)}
.filter-select{background:#FFFFFF;border:var(--border);border-radius:6px;color:var(--gray-700);font-family:inherit;font-size:13px;padding:9px 12px;outline:none;cursor:pointer;transition:border-color 0.15s}
.filter-select:focus{border-color:var(--black)}
.filter-select option{background:#FFFFFF;color:var(--black)}
.filter-count{font-size:12px;font-weight:500;letter-spacing:0.04em;text-transform:uppercase;color:var(--gray-400);margin-left:auto}

/* TABLE */
.lead-table{background:#FFFFFF;border:var(--border);border-radius:var(--radius-lg);overflow:hidden}
.table-header{display:grid;grid-template-columns:2fr 1.5fr 1.2fr 1fr 1fr 120px;background:var(--gray-50);border-bottom:var(--border);padding:11px 18px}
.th{font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--gray-400)}
.lead-row{border-bottom:var(--border);background:#FFFFFF}
.lead-row:last-child{border-bottom:none}
.lead-row-summary{display:grid;grid-template-columns:2fr 1.5fr 1.2fr 1fr 1fr 120px;padding:16px 18px;cursor:pointer;align-items:center;transition:background 0.12s}
.lead-row-summary:hover{background:var(--gray-50)}
.lead-company{display:flex;flex-direction:column;gap:3px}
.lead-company-name{font-size:14px;font-weight:600;color:var(--black);letter-spacing:-0.01em}
.lead-company-desc{font-size:12px;color:var(--gray-400);line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
.lead-person{display:flex;flex-direction:column;gap:3px}
.lead-person-name{font-size:13px;font-weight:500;color:var(--gray-700)}
.lead-person-email{font-size:12px;color:var(--green);cursor:pointer}
.lead-person-email:hover{text-decoration:underline}
.fit-badge{display:inline-flex;font-size:11px;font-weight:600;letter-spacing:0.02em;padding:3px 9px;border-radius:5px;width:fit-content}
.fit-high{background:var(--green-light);color:var(--green-text);border:1px solid var(--green-border)}
.fit-medium{background:var(--warm-bg);color:var(--warm-text);border:1px solid var(--warm-border)}
.fit-low{background:var(--gray-100);color:var(--gray-500);border:1px solid var(--gray-200)}
.fit-unknown{background:#FFFFFF;color:var(--gray-400);border:1px dashed var(--gray-300)}
.notes-preview{font-size:12px;color:var(--gray-400);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.status-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:500;padding:4px 10px;border-radius:20px;white-space:nowrap;background:var(--gray-50);border:var(--border);color:var(--gray-700)}
.status-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.s-untouched .status-dot{background:var(--gray-300)}
.s-untouched{color:var(--gray-400)}
.s-draft .status-dot{background:var(--gray-500)}
.s-sent .status-dot{background:var(--warm-border)}
.s-responded{background:var(--green-light);border-color:var(--green-border);color:var(--green-text)}
.s-responded .status-dot{background:var(--green)}
.s-followup .status-dot{background:var(--black)}
.row-actions{display:flex;gap:8px;align-items:center;justify-content:flex-end}
.icon-btn{width:28px;height:28px;border-radius:6px;border:var(--border);background:#FFFFFF;color:var(--gray-400);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color 0.15s,color 0.15s;font-size:12px}
.icon-btn:hover{border-color:var(--black);color:var(--black)}

/* PANEL */
.lead-panel{display:none;border-top:var(--border);background:var(--gray-50);padding:20px}
.lead-panel.open{display:block}
.panel-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px}
.panel-section{background:#FFFFFF;border:var(--border);border-radius:var(--radius);padding:18px}
.panel-section-label{font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--green);margin-bottom:14px}
.panel-field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.panel-field:last-child{margin-bottom:0}
.panel-field label{font-size:10px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--gray-400)}
.panel-input{background:#FFFFFF;border:var(--border);border-radius:6px;color:var(--black);font-family:inherit;font-size:13px;padding:9px 11px;outline:none;transition:border-color 0.15s;width:100%}
.panel-input:focus{border-color:var(--black)}
.panel-input::placeholder{color:var(--gray-400)}
.panel-textarea{background:#FFFFFF;border:var(--border);border-radius:6px;color:var(--black);font-family:inherit;font-size:13px;padding:9px 11px;outline:none;transition:border-color 0.15s;width:100%;resize:vertical;min-height:80px;line-height:1.65}
.panel-textarea:focus{border-color:var(--black)}
.panel-textarea::placeholder{color:var(--gray-400)}
.panel-select{background:#FFFFFF;border:var(--border);border-radius:6px;color:var(--black);font-family:inherit;font-size:13px;padding:9px 11px;outline:none;cursor:pointer;width:100%;transition:border-color 0.15s}
.panel-select:focus{border-color:var(--black)}
.panel-select option{background:#FFFFFF}

/* EMAIL SECTION */
.email-section{background:#FFFFFF;border:var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px}
.email-section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px;flex-wrap:wrap}
.email-section-label{font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--green)}
.email-btns{display:flex;gap:8px;flex-wrap:wrap}
.btn-sm{font-family:inherit;font-size:13px;font-weight:500;padding:8px 14px;border-radius:6px;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background 0.15s,border-color 0.15s,color 0.15s}
.btn-outline{background:#FFFFFF;border-color:var(--gray-200);color:var(--gray-700)}
.btn-outline:hover{border-color:var(--black);color:var(--black)}
.btn-accent{background:var(--black);color:#FFFFFF;font-weight:500}
.btn-accent:hover{background:#222222}
.btn-green{background:var(--green-light);border-color:var(--green-border);color:var(--green-text);font-weight:600}
.btn-green:hover{background:#CFF7DC}
.btn-blue{background:var(--gray-50);border-color:var(--gray-200);color:var(--gray-700);font-weight:500}
.btn-blue:hover{border-color:var(--black);color:var(--black)}
.btn-loading{opacity:0.6;pointer-events:none}
.email-output{background:#FFFFFF;border:var(--border);border-radius:6px;padding:14px;font-size:13px;color:#4B5563;line-height:1.7;white-space:pre-wrap;min-height:80px;max-height:280px;overflow-y:auto;display:none}
.email-output.visible{display:block}
.email-output:focus{outline:none;border-color:var(--black)}
.email-subject{background:var(--gray-50);border:var(--border);border-radius:6px;padding:8px 11px;font-size:12px;font-weight:500;color:var(--gray-500);margin-bottom:6px;display:none}
.email-subject.visible{display:block}
.email-actions{display:none;gap:8px;flex-wrap:wrap;margin-top:10px}
.email-actions.visible{display:flex}

/* HISTORY */
.history-section{background:#FFFFFF;border:var(--border);border-radius:var(--radius);padding:18px}
.history-section-label{font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--green);margin-bottom:12px}
.history-empty{font-size:13px;color:var(--gray-400)}
.history-item{border-bottom:var(--border);padding:12px 0;display:flex;flex-direction:column;gap:4px}
.history-item:first-child{padding-top:0}
.history-item:last-child{border-bottom:none;padding-bottom:0}
.history-item-header{display:flex;align-items:center;justify-content:space-between;gap:6px}
.history-item-type{font-size:10px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--green)}
.history-item-date{font-size:11px;color:var(--gray-400)}
.history-item-subject{font-size:13px;font-weight:600;color:var(--black)}
.history-item-preview{font-size:12px;color:var(--gray-500);line-height:1.6;white-space:pre-wrap;max-height:56px;overflow:hidden;cursor:pointer}
.history-item-preview.expanded{max-height:none}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(10,10,10,0.45);z-index:200;display:none;align-items:center;justify-content:center;padding:24px}
.modal-overlay.open{display:flex}
.modal{background:#FFFFFF;border:var(--border);border-radius:var(--radius-lg);width:100%;max-width:520px;overflow:hidden;box-shadow:0 20px 60px rgba(10,10,10,0.14)}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:var(--border)}
.modal-title{font-size:20px;font-weight:700;letter-spacing:-0.02em;color:var(--black)}
.modal-close{width:28px;height:28px;border-radius:6px;border:var(--border);background:#FFFFFF;color:var(--gray-400);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:border-color 0.15s,color 0.15s}
.modal-close:hover{border-color:var(--black);color:var(--black)}
.modal-body{padding:24px;max-height:70vh;overflow-y:auto}
.modal-field{margin-bottom:16px}
.modal-field label{display:block;font-size:10px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--gray-400);margin-bottom:6px}
.modal-input{background:#FFFFFF;border:var(--border);border-radius:6px;color:var(--black);font-family:inherit;font-size:14px;padding:10px 12px;outline:none;transition:border-color 0.15s;width:100%}
.modal-input:focus{border-color:var(--black)}
.modal-input::placeholder{color:var(--gray-400)}
.modal-footer{padding:16px 24px;border-top:var(--border);background:var(--gray-50);display:flex;gap:10px;justify-content:flex-end}
.lookup-status{font-size:13px;padding:5px 0;min-height:22px}
.lookup-status.loading{color:var(--gray-500)}
.lookup-status.error{color:var(--warm-text)}
.lookup-status.success{color:var(--green-text)}

/* EMPTY STATE */
.empty-state{padding:56px 24px;text-align:center;border:var(--border);border-radius:var(--radius-lg);background:var(--gray-50)}
.empty-state-icon{font-size:28px;margin-bottom:12px;opacity:0.35}
.empty-state-text{font-size:14px;color:var(--gray-500);line-height:1.65}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;z-index:300;background:#FFFFFF;border:var(--border);border-radius:var(--radius);padding:13px 18px;font-size:13px;font-weight:500;color:var(--black);display:none;align-items:center;gap:10px;box-shadow:0 12px 40px rgba(10,10,10,0.12)}
.toast.show{display:flex}
.toast-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0}
.toast-dot.info{background:var(--gray-400)}
.toast-dot.warn{background:var(--warm-border)}

/* SPINNER */
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:13px;height:13px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin 0.7s linear infinite;flex-shrink:0;opacity:0.85}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:#FFFFFF}
::-webkit-scrollbar-thumb{background:var(--gray-300);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--gray-400)}

@media(max-width:900px){
  .table-header,.fit-badge,.notes-preview{display:none}
  .lead-row-summary{grid-template-columns:1fr 1fr auto}
  .panel-grid{grid-template-columns:1fr}
  .layout{padding:20px 16px 40px}
  .topbar{padding:0 16px}
  .filter-input{min-width:160px;flex:1}
}
</style>
</head>
<body>

<!-- PASSWORD GATE -->
<div id="pw-gate">
  <div class="pw-card">
    <div class="pw-logo">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0"><polyline points="2,18 2,11 9,11 9,6 16,6 16,2" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="pw-wm">Reveneering</span>
    </div>
    <div class="pw-eyebrow">Internal tool</div>
    <div class="pw-title">CRM</div>
    <div class="pw-desc">Enter your password to continue.</div>
    <div class="pw-iw">
      <input class="pw-inp" type="password" id="pw-inp" placeholder="Password" autocomplete="off" onkeydown="if(event.key==='Enter')pwCheck()">
      <button class="pw-tog" id="pw-tog" onclick="pwToggle()">show</button>
    </div>
    <div class="pw-err" id="pw-err"></div>
    <button class="pw-btn" onclick="pwCheck()">Unlock &rarr;</button>
  </div>
</div>

<!-- NAV -->
<div class="topbar">
  <div style="display:flex;align-items:center;gap:14px">
    <a class="topbar-logo" href="#">
      <svg width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0"><polyline points="2,18 2,11 9,11 9,6 16,6 16,2" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="topbar-wordmark">Reveneering</span>
    </a>
    <span class="topbar-tag">CRM</span>
  </div>
  <div class="topbar-right">
    <button class="btn-import" id="notionBtn" onclick="runNotionSync()" title="Sync Discovered leads from Notion">🔄 Sync Notion</button>
    <button class="btn-import" id="importBtn" onclick="runGmailImport()" title="Import from Gmail Sent folder">⬇ Import Gmail</button>
    <button class="btn-add" onclick="openAddModal()">+ Add Lead</button>
  </div>
</div>

<div class="layout">
  <div class="filters">
    <input class="filter-input" id="filterName" placeholder="Search by company or founder..." oninput="renderLeads()">
    <select class="filter-select" id="filterFit" onchange="renderLeads()">
      <option value="">All fit scores</option>
      <option value="high">High fit</option>
      <option value="medium">Medium fit</option>
      <option value="low">Low fit</option>
      <option value="unknown">Unknown</option>
    </select>
    <select class="filter-select" id="filterStatus" onchange="renderLeads()">
      <option value="">All statuses</option>
      <option value="untouched">Untouched</option>
      <option value="draft">Draft prepared</option>
      <option value="sent">Email sent</option>
      <option value="responded">Response received</option>
      <option value="followup">Follow-up sent</option>
    </select>
    <div class="filter-count" id="filterCount"></div>
  </div>
  <div class="import-bar" id="importBar">
    <div class="import-bar-text" id="importBarText">Connecting to Gmail…</div>
    <button class="import-bar-close" onclick="closeImportBar()">✕</button>
  </div>
  <div class="lead-table">
    <div class="table-header">
      <div class="th">Company</div>
      <div class="th">Contact</div>
      <div class="th">Fit</div>
      <div class="th">Notes</div>
      <div class="th">Status</div>
      <div class="th" style="text-align:right">Actions</div>
    </div>
    <div id="leadRows"></div>
  </div>
</div>

<!-- ADD MODAL -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Add new lead</div>
      <button class="modal-close" onclick="closeAddModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-field">
        <label>Company name</label>
        <input class="modal-input" id="newCompanyName" placeholder="e.g. FarmWave Technologies" oninput="document.getElementById('lookupStatus').textContent=''">
      </div>
      <div style="display:flex;gap:8px;margin-bottom:12px">
        <button class="btn-sm btn-accent" id="lookupBtn" onclick="lookupCompany()" style="flex:1">
          <span id="lookupBtnText">🔍 Auto-fill from web</span>
        </button>
      </div>
      <div class="lookup-status" id="lookupStatus"></div>
      <div class="modal-field"><label>Founder / CEO</label><input class="modal-input" id="newFounderName" placeholder="Name"></div>
      <div class="modal-field"><label>Email</label><input class="modal-input" id="newEmail" placeholder="founder@company.com" type="email"></div>
      <div class="modal-field"><label>Description</label><input class="modal-input" id="newDesc" placeholder="One line on what they do"></div>
      <div class="modal-field"><label>Fit score</label>
        <select class="modal-input" id="newFit">
          <option value="unknown">Unknown</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-sm btn-outline" onclick="closeAddModal()">Cancel</button>
      <button class="btn-sm btn-accent" onclick="addLead()">Add lead</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"><div class="toast-dot" id="toastDot"></div><span id="toastMsg"></span></div>

<script>
// ─── CONFIG — update WORKER_URL after deploying the worker ────────────────────
const WORKER_URL = 'https://reveneering-crm.a-m-kappes.workers.dev';
const PASSWORD   = 'crm2025!'; // change this to whatever you want

// ─── PASSWORD ─────────────────────────────────────────────────────────────────
function pwCheck() {
  const inp = document.getElementById('pw-inp');
  const err = document.getElementById('pw-err');
  if (inp.value === PASSWORD) {
    const gate = document.getElementById('pw-gate');
    gate.classList.add('fade');
    setTimeout(() => gate.style.display = 'none', 420);
    setTimeout(() => { loadLeads(); }, 440);
  } else {
    err.textContent = 'Incorrect password.';
    inp.classList.remove('shk'); void inp.offsetWidth; inp.classList.add('shk');
    inp.value = '';
    setTimeout(() => inp.classList.remove('shk'), 400);
  }
}
function pwToggle() {
  const i = document.getElementById('pw-inp'), b = document.getElementById('pw-tog');
  const h = i.type === 'password';
  i.type = h ? 'text' : 'password';
  b.textContent = h ? 'hide' : 'show';
}
setTimeout(() => { const e = document.getElementById('pw-inp'); if(e) e.focus(); }, 150);

// ─── STORAGE (Google Drive via Worker) ───────────────────────────────────────
let driveFileId = null; // returned by worker on first save, reused after

async function loadLeads() {
  try {
    const res = await fetch(WORKER_URL + '/load');
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    leads = data.leads || [];
    driveFileId = data.fileId || null;
  } catch(e) {
    console.warn('Drive load failed:', e.message);
    leads = [];
  }
  renderLeads();
}

async function saveLeads() {
  try {
    const res = await fetch(WORKER_URL + '/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ leads, fileId: driveFileId }),
    });
    const data = await res.json();
    if (data.fileId) driveFileId = data.fileId;
  } catch(e) {
    console.warn('Drive save failed:', e.message);
  }
}

// ─── STATE ────────────────────────────────────────────────────────────────────
let leads = [];
let openPanels = new Set();

// ─── HELPERS ──────────────────────────────────────────────────────────────────
const SC = {untouched:'s-untouched',draft:'s-draft',sent:'s-sent',responded:'s-responded',followup:'s-followup'};
const SL = {untouched:'Untouched',draft:'Draft prepared',sent:'Sent',responded:'Responded',followup:'Follow-up sent'};
const FC = {high:'fit-high',medium:'fit-medium',low:'fit-low',unknown:'fit-unknown'};
const FL = {high:'High fit',medium:'Medium fit',low:'Low fit',unknown:'Unknown'};
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function getFiltered() {
  const n = document.getElementById('filterName').value.toLowerCase();
  const f = document.getElementById('filterFit').value;
  const s = document.getElementById('filterStatus').value;
  return leads.filter(l =>
    (!n || l.company.toLowerCase().includes(n) || (l.founder||'').toLowerCase().includes(n)) &&
    (!f || l.fit===f) && (!s || l.status===s)
  );
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function renderLeads() {
  const list = getFiltered();
  document.getElementById('filterCount').textContent = list.length + ' lead' + (list.length!==1?'s':'');
  const c = document.getElementById('leadRows');
  if (!list.length) {
    c.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🌾</div><div class="empty-state-text">No leads match your filters.</div></div>';
    return;
  }
  c.innerHTML = list.map(l => `
<div class="lead-row" id="row-${l.id}">
  <div class="lead-row-summary" onclick="togglePanel('${l.id}')">
    <div class="lead-company">
      <div class="lead-company-name">${esc(l.company)}</div>
      <div class="lead-company-desc">${esc(l.description||'—')}</div>
    </div>
    <div class="lead-person">
      <div class="lead-person-name">${esc(l.founder||'—')}</div>
      ${l.email
        ? `<div class="lead-person-email" onclick="event.stopPropagation();cpyEmail('${esc(l.email)}')">${esc(l.email)}</div>`
        : `<div style="font-size:11px;color:var(--muted2);cursor:pointer" onclick="event.stopPropagation();openApollo('${esc(l.company)}','${esc(l.founder||'')}')">Find email →</div>`}
    </div>
    <div><span class="fit-badge ${FC[l.fit]||'fit-unknown'}">${FL[l.fit]||'Unknown'}</span></div>
    <div class="notes-preview">${esc(l.notes||'—')}</div>
    <div><span class="status-badge ${SC[l.status]||'s-untouched'}"><span class="status-dot"></span>${SL[l.status]||'Untouched'}</span></div>
    <div class="row-actions" onclick="event.stopPropagation()">
      ${l.emailHistory&&l.emailHistory.length?`<span style="font-size:10px;color:var(--muted2)">${l.emailHistory.length}✉</span>`:''}
      <button class="icon-btn" onclick="deleteLead('${l.id}')" title="Delete">🗑</button>
    </div>
  </div>
  <div class="lead-panel ${openPanels.has(l.id)?'open':''}" id="panel-${l.id}">
    ${buildPanel(l)}
  </div>
</div>`).join('');
}

function buildPanel(l) {
  const hist = !l.emailHistory||!l.emailHistory.length
    ? '<div class="history-empty">No emails logged yet.</div>'
    : l.emailHistory.map((h,i)=>`
      <div class="history-item">
        <div class="history-item-header"><span class="history-item-type">${esc(h.type)}</span><span class="history-item-date">${esc(h.date)}</span></div>
        <div class="history-item-subject">${esc(h.subject)}</div>
        <div class="history-item-preview" onclick="this.classList.toggle('expanded')">${esc(h.body)}</div>
      </div>`).join('');

  return `<div>
  <div class="panel-grid">
    <div class="panel-section">
      <div class="panel-section-label">Company</div>
      <div class="panel-field"><label>Name</label><input class="panel-input" value="${esc(l.company)}" onchange="upd('${l.id}','company',this.value)"></div>
      <div class="panel-field"><label>Description</label><textarea class="panel-textarea" rows="3" onchange="upd('${l.id}','description',this.value)">${esc(l.description||'')}</textarea></div>
      <div class="panel-field"><label>Fit</label>
        <select class="panel-select" onchange="updRender('${l.id}','fit',this.value)">
          <option value="unknown" ${l.fit==='unknown'?'selected':''}>Unknown</option>
          <option value="high" ${l.fit==='high'?'selected':''}>High</option>
          <option value="medium" ${l.fit==='medium'?'selected':''}>Medium</option>
          <option value="low" ${l.fit==='low'?'selected':''}>Low</option>
        </select>
      </div>
      ${l.fitReason?`<div style="font-size:11px;color:var(--muted2);line-height:1.5;margin-top:4px">${esc(l.fitReason)}</div>`:''}
    </div>
    <div class="panel-section">
      <div class="panel-section-label">Contact</div>
      <div class="panel-field"><label>Founder / CEO</label><input class="panel-input" value="${esc(l.founder||'')}" placeholder="Name" onchange="upd('${l.id}','founder',this.value)"></div>
      <div class="panel-field"><label>Email</label>
        <div style="display:flex;gap:6px">
          <input class="panel-input" value="${esc(l.email||'')}" placeholder="founder@company.com" onchange="upd('${l.id}','email',this.value)" style="flex:1">
          <button class="btn-sm btn-outline" onclick="openApollo('${esc(l.company)}','${esc(l.founder||'')}')" style="white-space:nowrap;font-size:11px">Apollo →</button>
        </div>
      </div>
      <div class="panel-field"><label>Status</label>
        <select class="panel-select" onchange="updRender('${l.id}','status',this.value)">
          <option value="untouched" ${l.status==='untouched'?'selected':''}>Untouched</option>
          <option value="draft" ${l.status==='draft'?'selected':''}>Draft prepared</option>
          <option value="sent" ${l.status==='sent'?'selected':''}>Email sent</option>
          <option value="responded" ${l.status==='responded'?'selected':''}>Response received</option>
          <option value="followup" ${l.status==='followup'?'selected':''}>Follow-up sent</option>
        </select>
      </div>
    </div>
    <div class="panel-section">
      <div class="panel-section-label">Notes</div>
      <textarea class="panel-textarea" rows="8" placeholder="Context for calls, objections, timing, warm intros…" onchange="upd('${l.id}','notes',this.value)" style="min-height:120px">${esc(l.notes||'')}</textarea>
      <div style="font-size:10px;color:var(--muted2);margin-top:6px">Used to personalise AI-generated emails.</div>
    </div>
  </div>
  <div class="email-section">
    <div class="email-section-header">
      <div class="email-section-label">Email composer</div>
      <div class="email-btns">
        <button class="btn-sm btn-outline" id="btn-intro-${l.id}" onclick="generateEmail('${l.id}','intro')">✉ Intro email</button>
        <button class="btn-sm btn-outline" id="btn-followup-${l.id}" onclick="generateEmail('${l.id}','followup')">↩ Follow-up</button>
      </div>
    </div>
    <div id="subject-${l.id}" class="email-subject"></div>
    <div id="email-output-${l.id}" class="email-output" contenteditable="true" spellcheck="true"></div>
    <div id="email-actions-${l.id}" class="email-actions">
      <button class="btn-sm btn-green" onclick="sendToGmail('${l.id}')">📬 Open in Gmail</button>
      <button class="btn-sm btn-blue" onclick="logEmail('${l.id}')">📋 Log as sent</button>
      <button class="btn-sm btn-outline" onclick="clearEmail('${l.id}')">✕ Clear</button>
    </div>
  </div>
  <div class="history-section">
    <div class="history-section-label">Email history (${l.emailHistory?l.emailHistory.length:0})</div>
    ${hist}
  </div>
</div>`;
}

function togglePanel(id) {
  openPanels.has(id) ? openPanels.delete(id) : openPanels.add(id);
  renderLeads();
}
function upd(id,k,v){const l=leads.find(x=>x.id===id);if(l){l[k]=v;saveLeads();}}
function updRender(id,k,v){upd(id,k,v);renderLeads();}
function deleteLead(id){if(!confirm('Remove this lead?'))return;leads=leads.filter(x=>x.id!==id);openPanels.delete(id);saveLeads();renderLeads();toast('Lead removed');}
function cpyEmail(em){navigator.clipboard.writeText(em).then(()=>toast('Email copied','info'));}
function openApollo(co,fo){window.open('https://app.apollo.io/#/people?q_organization_name='+encodeURIComponent(co)+'&q_keywords='+encodeURIComponent((fo+' '+co).trim()),'_blank');toast('Opening Apollo','info');}

// ─── EMAIL GENERATION ─────────────────────────────────────────────────────────
async function generateEmail(id, type) {
  const l = leads.find(x=>x.id===id); if(!l) return;
  const btn = document.getElementById('btn-'+type+'-'+id);
  const eo = document.getElementById('email-output-'+id);
  const es = document.getElementById('subject-'+id);
  const ea = document.getElementById('email-actions-'+id);
  const orig = btn.innerHTML;
  btn.classList.add('btn-loading');
  btn.innerHTML = '<div class="spinner"></div> Generating…';

  try {
    const res = await fetch(WORKER_URL + '/email', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        type, company: l.company, founder: l.founder,
        description: l.description, fitReason: l.fitReason, fit: l.fit,
        notes: l.notes, emailHistory: l.emailHistory
      })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    const parsed = JSON.parse(data.text.replace(/```json|```/g,'').trim());
    es.textContent = 'Subject: ' + parsed.subject;
    es.classList.add('visible');
    eo.textContent = parsed.body;
    eo.classList.add('visible');
    eo.dataset.subject = parsed.subject;
    ea.classList.add('visible');
    if (l.status==='untouched') { l.status='draft'; saveLeads(); }
  } catch(err) {
    eo.textContent = 'Error: ' + (err.message||'Worker unreachable');
    eo.classList.add('visible');
  }
  btn.classList.remove('btn-loading');
  btn.innerHTML = orig;
}

function sendToGmail(id) {
  const l=leads.find(x=>x.id===id); if(!l) return;
  const eo=document.getElementById('email-output-'+id);
  const es=document.getElementById('subject-'+id);
  if (!eo||!eo.textContent.trim()) return;
  const subj = eo.dataset.subject || es.textContent.replace('Subject: ','') || 'Following up – Reveneering';
  // Convert plain text to basic HTML for Gmail (preserves line breaks)
  const plainText = eo.innerText || eo.textContent;
  const htmlBody = '<div style="font-family:Arial,sans-serif;font-size:14px;line-height:1.6">'
    + plainText.split('\n').map(l => l.trim() === '' ? '<br>' : '<p style="margin:0 0 8px">' + l.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</p>').join('')
    + '</div>';
  const gmailUrl = 'https://mail.google.com/mail/?view=cm&fs=1'
    + '&to=' + encodeURIComponent(l.email||'')
    + '&su=' + encodeURIComponent(subj)
    + '&body=' + encodeURIComponent(plainText)
    + '&html=' + encodeURIComponent(htmlBody);
  window.open(gmailUrl, '_blank');
  toast('Opening Gmail draft','info');
}

function logEmail(id) {
  const l=leads.find(x=>x.id===id); if(!l) return;
  const eo=document.getElementById('email-output-'+id);
  const es=document.getElementById('subject-'+id);
  if(!eo||!eo.textContent.trim()) return;
  const subj = eo.dataset.subject || es.textContent.replace('Subject: ','') || 'Email';
  const type = l.status==='sent'?'Follow-up email':'Intro email';
  const today = new Date().toISOString().slice(0,10);
  if (!l.emailHistory) l.emailHistory=[];
  l.emailHistory.unshift({type,subject:subj,date:today,body:eo.innerText||eo.textContent});
  l.status = l.status==='responded'?'followup':'sent';
  saveLeads(); clearEmail(id); renderLeads(); openPanels.add(id); renderLeads();
  toast('Email logged');
}

function clearEmail(id) {
  const eo=document.getElementById('email-output-'+id);
  const es=document.getElementById('subject-'+id);
  const ea=document.getElementById('email-actions-'+id);
  if(eo){eo.textContent='';eo.classList.remove('visible');eo.dataset.subject='';}
  if(es){es.textContent='';es.classList.remove('visible');}
  if(ea)ea.classList.remove('visible');
}

// ─── ADD MODAL ────────────────────────────────────────────────────────────────
function openAddModal(){document.getElementById('addModal').classList.add('open');setTimeout(()=>document.getElementById('newCompanyName').focus(),80);}
function closeAddModal(){
  document.getElementById('addModal').classList.remove('open');
  ['newCompanyName','newFounderName','newEmail','newDesc'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('newFit').value='unknown';
  document.getElementById('lookupStatus').textContent='';
  delete document.getElementById('newFit').dataset.reason;
}

async function lookupCompany() {
  const name = document.getElementById('newCompanyName').value.trim();
  if (!name) { setLookupStatus('Enter a company name first','error'); return; }
  const btn = document.getElementById('lookupBtn');
  const btnText = document.getElementById('lookupBtnText');
  btn.classList.add('btn-loading');
  btnText.innerHTML = '<div class="spinner"></div> Searching…';
  setLookupStatus('Searching…','loading');

  try {
    const res = await fetch(WORKER_URL + '/lookup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ company: name })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    const p = JSON.parse(data.text.replace(/```json|```/g,'').trim());
    if(p.founder) document.getElementById('newFounderName').value = p.founder;
    if(p.description) document.getElementById('newDesc').value = p.description;
    if(p.fit) document.getElementById('newFit').value = p.fit;
    if(p.fitReason) document.getElementById('newFit').dataset.reason = p.fitReason;
    setLookupStatus('✓ Information found','success');
  } catch(err) {
    setLookupStatus('Error: '+(err.message||'Could not auto-fill'),'error');
  }
  btn.classList.remove('btn-loading');
  btnText.textContent = '🔍 Auto-fill from web';
}

function setLookupStatus(msg,type){const el=document.getElementById('lookupStatus');el.textContent=msg;el.className='lookup-status '+type;}

function addLead() {
  const co = document.getElementById('newCompanyName').value.trim();
  if (!co) { alert('Company name required'); return; }
  const ft = document.getElementById('newFit');
  const lead = {
    id:'l'+Date.now(), company:co,
    founder:document.getElementById('newFounderName').value.trim(),
    email:document.getElementById('newEmail').value.trim(),
    description:document.getElementById('newDesc').value.trim(),
    fit:ft.value, fitReason:ft.dataset.reason||'',
    status:'untouched', notes:'', emailHistory:[], createdAt:Date.now()
  };
  leads.unshift(lead);
  saveLeads(); closeAddModal(); renderLeads();
  openPanels.add(lead.id); renderLeads();
  toast('Lead added');
}

// ─── TOAST ────────────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg,type='') {
  const el=document.getElementById('toast');
  document.getElementById('toastDot').className='toast-dot'+(type?' '+type:'');
  document.getElementById('toastMsg').textContent=msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),2500);
}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAddModal();});

// ─── GMAIL IMPORT ─────────────────────────────────────────────────────────────
async function runGmailImport() {
  const btn = document.getElementById('importBtn');
  const bar = document.getElementById('importBar');
  const txt = document.getElementById('importBarText');

  btn.disabled = true;
  btn.textContent = 'Importing…';
  bar.classList.add('show');

  try {
    // ── Step 1: Fetch raw emails from Gmail ──
    txt.innerHTML = '<strong>Step 1/2</strong> — Connecting to Gmail and reading sent emails… (may take 15–20 seconds)';
    await new Promise(r => setTimeout(r, 50));

    const fetchRes = await fetch(WORKER_URL + '/import-fetch', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({}),
    });
    const fetchData = await fetchRes.json();
    if (fetchData.error) throw new Error(fetchData.error);

    const { groups, totalEmails } = fetchData;

    // ── Step 2: AI extraction + save ──
    txt.innerHTML = `<strong>Step 2/2</strong> — Extracting ${groups.length} contacts with AI and saving to Drive…`;
    await new Promise(r => setTimeout(r, 50));

    const processRes = await fetch(WORKER_URL + '/import-process', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ groups, existingLeads: leads, fileId: driveFileId }),
    });
    const processData = await processRes.json();
    if (processData.error) throw new Error(processData.error);

    // Update local state
    leads = processData.leads;
    if (processData.fileId) driveFileId = processData.fileId;
    renderLeads();

    txt.innerHTML = `✓ Done — <strong>${processData.importCount} new leads</strong> added, <strong>${processData.updateCount} existing leads</strong> updated from ${totalEmails} emails across ${groups.length} contacts.`;

  } catch(err) {
    txt.innerHTML = '<strong>Import failed:</strong> ' + (err.message || 'Unknown error');
  }

  btn.disabled = false;
  btn.textContent = '⬇ Import Gmail';
}

function closeImportBar() {
  document.getElementById('importBar').classList.remove('show');
}

// ─── NOTION SYNC ──────────────────────────────────────────────────────────────
async function runNotionSync() {
  const btn = document.getElementById('notionBtn');
  const bar = document.getElementById('importBar');
  const txt = document.getElementById('importBarText');

  btn.disabled = true;
  btn.textContent = 'Syncing…';
  bar.classList.add('show');
  txt.innerHTML = '<strong>Syncing Notion</strong> — Fetching Discovered leads from your pipeline…';

  try {
    await new Promise(r => setTimeout(r, 50));

    const res = await fetch(WORKER_URL + '/import-notion', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ existingLeads: leads, fileId: driveFileId }),
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    leads = data.leads;
    if (data.fileId) driveFileId = data.fileId;
    renderLeads();

    txt.innerHTML = `✓ Notion sync complete — <strong>${data.importCount} new leads</strong> added, <strong>${data.updateCount} existing leads</strong> updated from ${data.total} Discovered entries.`;

  } catch(err) {
    txt.innerHTML = '<strong>Notion sync failed:</strong> ' + (err.message || 'Unknown error');
  }

  btn.disabled = false;
  btn.textContent = '🔄 Sync Notion';
}
</script>
</body>
</html>
