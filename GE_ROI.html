<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Genus Echo · ROI Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rethink+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F7F7F5;--panel:#FFFFFF;--ink:#111111;--muted:#5A5A57;--faint:#8C8C86;
    --indigo:#4B4DED;--grapefruit:#FF5A5F;--line:#E4E4DE;}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
    font-family:'Rethink Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    box-shadow:0 8px 30px rgba(17,17,17,.07),0 1px 2px rgba(17,17,17,.05);
    padding:38px 36px;width:380px;max-width:92vw;text-align:center}
  .logo{width:48px;height:48px;border-radius:11px;background:var(--indigo);color:var(--bg);
    display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 18px;
    box-shadow:0 2px 10px rgba(75,77,237,.30)}
  h1{font-size:18px;margin:0 0 4px;font-weight:800;letter-spacing:.2px}
  p.sub{margin:0 0 22px;color:var(--muted);font-size:12.5px;
    font-family:'IBM Plex Mono',monospace;letter-spacing:.3px}
  .lockrow{display:flex;align-items:center;gap:6px;justify-content:center;color:var(--faint);
    font-size:11px;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.7px;margin-bottom:14px}
  input{width:100%;padding:12px 14px;font-size:14px;border:1px solid var(--line);border-radius:10px;
    background:#FBFBF9;color:var(--ink);font-family:'IBM Plex Mono',monospace;text-align:center;letter-spacing:1px}
  input:focus{outline:none;border-color:var(--indigo);box-shadow:0 0 0 3px rgba(75,77,237,.12)}
  button{width:100%;margin-top:14px;padding:12px;font-size:14px;font-weight:700;border:none;border-radius:10px;
    background:var(--indigo);color:#fff;cursor:pointer;font-family:'Rethink Sans',sans-serif;letter-spacing:.3px}
  button:hover{filter:brightness(1.05)} button:disabled{opacity:.55;cursor:default}
  .err{color:var(--grapefruit);font-size:12px;margin-top:13px;min-height:16px;font-family:'IBM Plex Mono',monospace}
  .foot{margin-top:20px;color:var(--faint);font-size:10.5px;font-family:'IBM Plex Mono',monospace;line-height:1.5}
</style>
</head>

  async function unlock(){
    const pw=$('pw').value; if(!pw){return;}
    $('go').disabled=true; $('err').textContent='Decrypting...';
    try{
      const km=await crypto.subtle.importKey('raw', new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
      const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:dec(SALT),iterations:ITERS,hash:'SHA-256'},

      document.open(); document.write(html); document.close();
    }catch(e){
      $('err').textContent='Incorrect password.';
      $('go').disabled=false; $('pw').value=''; $('pw').focus();
    }
  }

  $('pw').addEventListener('keydown', e=>{ if(e.key==='Enter') unlock(); });
